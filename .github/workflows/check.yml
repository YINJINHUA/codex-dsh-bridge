name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:release
      - run: npm test
      - run: npm run check:pack

  windows_shards:
    name: Windows tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Initialize Windows PowerShell before timed security checks
        shell: powershell
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows tests spawn 5.1, while the default Actions shell is PowerShell 7.
          # Read-only cold start; no bridge state, ACL changes or relaxed runtime limits.
          $sections = [Security.AccessControl.AccessControlSections]::Owner -bor [Security.AccessControl.AccessControlSections]::Access
          $item = Get-Item -LiteralPath $env:SystemRoot -Force
          $acl = [IO.Directory]::GetAccessControl($item.FullName, $sections)
          if ($null -eq $acl) { throw 'Windows PowerShell ACL initialization failed' }
          Write-Output 'Windows PowerShell and ACL APIs initialized; runtime checks retain their 10-second deadline.'
      - run: npm run check:release
      - run: npm test -- --shard=${{ matrix.shard }}/3
      - run: npm run check:pack

  windows:
    # Preserve the original check name for repositories requiring that status.
    name: test (windows-latest, 24)
    needs: windows_shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all Windows shards to pass
        env:
          RESULT: ${{ needs.windows_shards.result }}
        run: test "$RESULT" = success
